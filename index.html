<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جيبها - Jiibha</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="apple-touch-icon" href="/app-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Tajawal Font (Non-blocking with display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    </noscript>
    <style>
      body, #root {
        background-color: #040c1e;
        margin: 0;
        padding: 0;
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #040c1e; overflow: hidden; margin: 0; padding: 0;">
        <div style="position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -8px; border-radius: 50%; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: #D4AF37; animation: jiibhaSpin 1.2s linear infinite;"></div>
          <div style="width: 110px; height: 110px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #FFDF73 0%, #D4AF37 50%, #8C6D1F 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);">
            <div style="width: 100%; height: 100%; border-radius: 50%; background: #070d1e; display: flex; align-items: center; justify-content: center; overflow: hidden;">
              <img src="/app-logo.png" alt="Jiibha" style="width: 82%; height: 82%; object-fit: contain; display: block;" />
            </div>
          </div>
        </div>
      </div>
      <style>
        @keyframes jiibhaSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جيبها-jiibha</title>
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="apple-touch-icon" href="/app-logo.png" />
    <!-- Tajawal Font (Non-blocking with display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    </noscript>
    <style>
      body, #root {
        background-color: #040c1e;
        margin: 0;
        padding: 0;
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #071638 0%, #030a1a 100%);">
        <img src="/app-logo.png" alt="JIIBHA" style="width: 84px; height: 84px; object-fit: contain; margin-bottom: 24px; filter: drop-shadow(0 0 20px rgba(212,175,55,0.4)); animation: pulseLogo 2s ease-in-out infinite;" />
        <div style="width: 44px; height: 44px; border: 3px solid rgba(212,175,55,0.25); border-top-color: #f3e5ab; border-radius: 50%; animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite; box-shadow: 0 0 15px rgba(212,175,55,0.3);"></div>
        <p style="color: #f3e5ab; font-size: 14px; margin-top: 16px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.9;">يرجى الانتظار...</p>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseLogo { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(212,175,55,0.4)); } 50% { transform: scale(1.04); filter: drop-shadow(0 0 35px rgba(212,175,55,0.7)); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

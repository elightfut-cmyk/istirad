<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جيبها - Jiibha</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="apple-touch-icon" href="/app-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#040c1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-navbutton-color" content="#040c1e" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Tajawal Font (Non-blocking with display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    </noscript>
    <style>
      html, body, #root {
        background-color: #040c1e !important;
        background: #040c1e !important;
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
